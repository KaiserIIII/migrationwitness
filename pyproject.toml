[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "migrationwitness"
version = "0.1.0"
description = "Bounded disposable PostgreSQL migration runtime contract experiments"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = ["psycopg[binary]==3.3.4"]

[project.scripts]
migrationwitness = "migrationwitness.cli:main"

[tool.setuptools]
packages = ["migrationwitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
